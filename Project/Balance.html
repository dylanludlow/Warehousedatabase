<!DOCTYPE html>

<html lang="en">

<head>

  <meta charset="UTF-8">

  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Warehouse &amp; Accounting — Balance Change</title>



  <link rel="stylesheet" href=https://cdn.jsdelivr.net/npm/spectre.css/dist/spectre.min.css>

  <link rel="stylesheet" href=https://cdn.jsdelivr.net/npm/spectre.css/dist/spectre-icons.min.css>

  <link rel="stylesheet" href="static/style.css">

</head>

<body>



  <header class="app-header">

    <div class="page-wrap">

      <div class="navbar">

        <section class="navbar-section">

          <span class="app-title">📦 Warehouse &amp; Accounting</span>

        </section>

        <section class="navbar-section">

          <a href="index.html"   class="btn btn-link text-light">Dashboard</a>

          <a href="history.html" class="btn btn-link text-light">History</a>

        </section>

      </div>

    </div>

  </header>



  <main class="page-wrap">



    <div class="breadcrumb">

      <a href="index.html">Dashboard</a> &nbsp;›&nbsp; <span>Balance change</span>

    </div>



    <div class="toast toast-error d-hide" id="error-banner">

      Please correct the highlighted fields and submit again.

    </div>



    <div class="form-card">

      <h2>Change Account Balance</h2>



      <form action="/balance/" method="post" novalidate>



        <div class="form-group">

          <label class="form-label" for="operation">Type of operation</label>

          <select class="form-select" id="operation" name="operation" required>

            <option value="" disabled selected>Choose…</option>

            <option value="add">Add (credit)</option>

            <option value="subtract">Subtract (debit)</option>

          </select>

        </div>



        <div class="form-group">

          <label class="form-label" for="value">Value (€)</label>

          <input class="form-input" type="number" id="value" name="value"

                 min="0" step="0.01" placeholder="0.00" required>

        </div>



        <div class="form-actions">

          <button type="submit" class="btn btn-primary">Apply change</button>

          <a href="index.html" class="btn btn-link">Cancel</a>

        </div>



      </form>

    </div>



  </main>



  <footer class="app-footer">

    Warehouse &amp; Accounting System — front-end prototype

  </footer>



</body>

</html>
